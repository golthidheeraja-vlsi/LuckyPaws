<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuckyPaws</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f8f2e9; --panel: #fffcf7; --soft: #f1e7d9; --soft-2: #e9dcc9; --line: #e5d7c3;
    --ink: #3a2a1f; --muted: #8b7563; --accent: #7a5236; --accent-2: #a3794f; --accent-ink: #fffaf2;
    --deep: #4b3426; --bad: #a3412d;
    --radius: 16px; --shadow: 0 1px 2px rgba(58,42,31,.05), 0 8px 24px rgba(58,42,31,.06);
    --font: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--page); }
  body { margin: 0; color: var(--ink); font: 15.5px/1.6 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  img.ph { display: inline-block; vertical-align: middle; object-fit: cover; background: #fff; border-radius: 50%; border: 1.5px solid var(--line); flex: none; }

  header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .bar { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; font: 800 21px/1 var(--font); color: var(--deep); text-decoration: none; letter-spacing: -.2px; }
  .logo small { display: block; font: 600 11.5px/1.3 var(--font); color: var(--muted); letter-spacing: .3px; }
  nav.menu { margin-left: auto; display: flex; gap: 2px; align-items: center; }
  nav.menu a { padding: 7px 13px; border-radius: 999px; color: var(--muted); text-decoration: none; white-space: nowrap; font-size: 14.5px; font-weight: 700; }
  nav.menu a:hover { color: var(--ink); background: var(--soft); }
  nav.menu a.active { color: var(--deep); background: var(--soft); }
  nav.menu a.sos { color: var(--accent-ink); background: var(--deep); }
  nav.menu a.sos:hover, nav.menu a.sos.active { background: var(--accent); color: var(--accent-ink); }
  .burger { display: none; margin-left: auto; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-weight: 700; }
  @media (max-width: 960px) {
    .burger { display: block; }
    nav.menu { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px 14px; }
    nav.menu.open { display: flex; }
    nav.menu a { border-radius: 10px; }
  }

  main { max-width: 1120px; margin: 0 auto; padding: 30px 16px 64px; }
  h1 { font: 800 30px/1.2 var(--font); margin: 0 0 6px; color: var(--deep); letter-spacing: -.3px; }
  h2 { font: 800 19px/1.3 var(--font); margin: 0 0 12px; color: var(--deep); }
  h3 { font: 700 16px/1.35 var(--font); margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; max-width: 720px; }
  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .crumb a { color: var(--muted); }
  .title-row { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .title-row h1 { margin: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

  .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: center; background: var(--soft); border: 1px solid var(--line); border-radius: 24px; padding: 40px; margin-bottom: 22px; }
  .hero h1 { font-size: 42px; line-height: 1.12; }
  .hero h1 span { color: var(--accent-2); }
  .hero p { color: var(--muted); max-width: 500px; font-size: 16.5px; }
  .hero .tag { display: inline-block; color: var(--accent); border: 1px solid var(--soft-2); background: var(--panel); border-radius: 999px; padding: 3px 13px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
  .collage { position: relative; height: 290px; }
  .collage img { position: absolute; object-fit: contain; background: #fff; padding: 10px; border-radius: 50%; border: 1.5px solid var(--soft-2); box-shadow: 0 10px 24px rgba(58,42,31,.08); }
  .collage .c1 { width: 210px; height: 210px; left: 6%; top: 48px; }
  .collage .c2 { width: 158px; height: 158px; right: 6%; top: 0; }
  .collage .c3 { width: 128px; height: 128px; right: 17%; bottom: 0; }
  @media (max-width: 800px) { .hero { grid-template-columns: 1fr; padding: 26px; } .hero h1 { font-size: 32px; } .collage { height: 210px; width: 100%; max-width: 400px; margin: 0 auto; } .collage .c1 { width: 132px; height: 132px; top: 50px; } .collage .c2 { width: 110px; height: 110px; } .collage .c3 { width: 86px; height: 86px; } }

  .sos-band { display: flex; gap: 16px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--deep); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .sos-band h2 { margin: 0; }
  .sos-band p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; }
  .sos-band .btn { margin-left: auto; }

  .dash { display: block; text-decoration: none; color: var(--ink); border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
  .dash:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(58,42,31,.1); }
  .dash .banner { height: 180px; display: flex; align-items: center; justify-content: center; background: var(--soft); border-bottom: 1px solid var(--line); }
  .dash .banner img { height: 150px; width: 150px; object-fit: contain; border-radius: 50%; background: #fff; padding: 8px; border: 1.5px solid var(--soft-2); }
  .dash .body { padding: 18px 22px 20px; }
  .dash p { color: var(--muted); margin: 0 0 10px; }
  .dash .go { color: var(--accent); font-weight: 800; font-size: 14px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
  .tile .label { color: var(--muted); font-size: 13px; font-weight: 700; }
  .tile .value { font: 800 28px/1.15 var(--font); color: var(--deep); }
  .option { display: block; text-decoration: none; color: var(--ink); padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); transition: border-color .15s; cursor: pointer; }
  .option:hover { border-color: var(--accent-2); }
  .option p { margin: 0; color: var(--muted); font-size: 14px; }
  .option .num { display: inline-block; font: 800 12px/1 var(--font); color: var(--accent); background: var(--soft); border-radius: 999px; padding: 4px 9px; margin-bottom: 6px; }

  form.f { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
  label.field > span:first-child { color: var(--ink); font-weight: 700; }
  .field.wide { grid-column: 1 / -1; }
  .req { color: var(--bad); }
  input, select, textarea { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  .err { color: var(--bad); font-size: 12px; min-height: 15px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; grid-column: 1 / -1; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 20px; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-block; font-weight: 700; }
  .btn:hover { border-color: var(--accent-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: var(--deep); }
  .btn.red { background: var(--deep); border-color: var(--deep); color: var(--accent-ink); }
  .btn.small { padding: 5px 13px; font-size: 13px; }

  .upload { border: 1.5px dashed var(--soft-2); border-radius: 14px; background: var(--page); padding: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .upload input[type=file] { border: 0; background: none; padding: 0; }
  .upload .preview { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; border: 1px solid var(--line); }
  .thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); cursor: zoom-in; display: block; }
  #lightbox { position: fixed; inset: 0; background: rgba(43,30,22,.75); display: grid; place-items: center; z-index: 20; padding: 16px; cursor: zoom-out; }
  #lightbox img { max-width: min(92vw, 720px); max-height: 85vh; border-radius: 14px; background: #fff; }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 10px 9px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  td .sub { display: block; font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; }
  .b-open { background: var(--soft); color: var(--accent); }
  .b-done { background: #ece6dc; color: #5f4b3b; }
  .b-urgent { background: var(--deep); color: var(--accent-ink); }
  .b-neutral { background: var(--soft); color: var(--muted); }
  .empty { color: var(--muted); padding: 16px 2px; }
  .note { background: var(--soft); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: var(--ink); }
  .note.red { background: #f4e4d8; border-left: 4px solid var(--deep); }
  .note.green { background: #efe9df; border-left: 4px solid var(--accent-2); }
  .note.amber { background: #f6ebd9; border-left: 4px solid var(--accent-2); }

  .petcard { display: flex; gap: 14px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; color: var(--ink); transition: border-color .15s; }
  .petcard:hover { border-color: var(--accent-2); }
  .avatar { width: 62px; height: 62px; flex: none; }
  .avatar img.ph { width: 100%; height: 100%; }
  .petcard .sub { color: var(--muted); font-size: 13px; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; font-size: 14px; }
  dl.facts dt { color: var(--muted); }
  dl.facts dd { margin: 0; }

  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 15px; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--ink); }
  .tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  ul.clean { margin: 0; padding-left: 20px; }
  ul.clean li { margin: 4px 0; }
  ol.steps { margin: 0; padding-left: 22px; }
  ol.steps li { margin: 6px 0; }

  .em-head { background: var(--soft); border: 1px solid var(--line); border-left: 5px solid var(--deep); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 20px; }
  .em-head h1 { margin: 0; }
  .em-head p { color: var(--muted); margin: 4px 0 0; }
  .timer { color: var(--deep); font: 800 56px/1 var(--font); letter-spacing: 2px; margin: 8px 0 12px; }
  .timer.over { color: var(--bad); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 9px 4px; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .check input { margin-top: 5px; width: 17px; height: 17px; accent-color: var(--accent); }
  .gums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .gum { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; border: 1px solid var(--line); background: #fff; }
  .gum b { display: block; }
  .gum i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.15); }
  .clinic { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; color: var(--ink); }
  .clinic .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .chat { display: flex; flex-direction: column; height: min(62vh, 560px); }
  .chat-log { flex: 1; overflow-y: auto; padding: 4px 2px 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 14.5px; white-space: pre-line; }
  .msg.bot { background: var(--soft); border-top-left-radius: 4px; }
  .msg.me { background: var(--accent); color: var(--accent-ink); margin-left: auto; border-top-right-radius: 4px; }
  .chat-input { display: flex; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
  .chat-input input { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 13px; font-size: 13px; cursor: pointer; font-weight: 700; color: var(--ink); }
  .chip:hover { border-color: var(--accent-2); }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--deep); color: var(--accent-ink); padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 700; transition: .2s; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; z-index: 30; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer { border-top: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 13px; padding: 22px 16px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#home" id="logo">
      <span id="logo-img"></span>
      <span>LuckyPaws<small>Rescue · Care · Connect</small></span>
    </a>
    <button class="burger" id="burger" aria-label="Open menu">&#9776; Menu</button>
    <nav class="menu" id="menu">
      <a href="#home" data-nav="home">Home</a>
      <a href="#rescue" data-nav="rescue">Rescue &amp; Stray</a>
      <a href="#mypet" data-nav="mypet">My Pet</a>
      <a href="#emergency" data-nav="emergency" class="sos">Emergency Help</a>
      <a href="#care" data-nav="care">Food &amp; Care</a>
      <a href="#ask" data-nav="ask">Ask LuckyPaws</a>
    </nav>
  </div>
</header>

<main id="app"></main>
<footer>LuckyPaws prototype &middot; Lakshmi Dheeraja &middot; data is stored only in this browser &middot; first aid tips do not replace a vet</footer>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="cities"></datalist>

<script>
/* ================= Data and rules ================= */
const KEY = "luckypaws-v3";
const now = new Date();
const TODAY = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
const DAYS = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const ageYears = dob => {
  const d = new Date(dob), t = new Date(TODAY);
  let a = t.getFullYear() - d.getFullYear();
  if (t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) a--;
  return a;
};
const fmt = iso => iso ? iso.split("-").reverse().join("/") : "-";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Cute cartoon pet pictures (free illustrations from Unsplash, saved in images/) */
const PHOTO = {
  logo: "dog-beagle", dog: "dog-puppy", poodle: "dog-orange", guideDog: "dog-beagle", cat: "cat-kitten", catLove: "dog-bone", catSad: "missing-poster",
  catWow: "cat-black", rabbit: "bunny", hug: "dog-happy", love: "dog-happy", bandage: "dog-pug", dizzy: "dog-sleep", vomit: "cat-rest",
  breath: "cat-fluffy", steth: "dog-face", siren: "cat-orange", sos: "bird-parrot", home: "pets-beanbag", bone: "dog-eating",
  chat: "bird-yellow", heart: "hamster", wave: "bunny-carrot", kitten: "cat-fluffy"
};
function em(name, size = 32, cls = "") {
  return `<img class="ph ${cls}" src="images/${PHOTO[name] || name}.png" width="${size}" height="${size}" alt="">`;
}
const DOG_PICS = ["dog-puppy", "dog-beagle", "dog-orange"], CAT_PICS = ["cat-kitten", "cat-fluffy", "cat-orange"], OTHER_PICS = ["bunny", "bunny-carrot", "hamster", "bird-blue", "bunny-brown"];
const petPic = (species, size, id = 0) => {
  const list = species === "Dog" ? DOG_PICS : species === "Cat" ? CAT_PICS : OTHER_PICS;
  return em(list[(id + list.length - 1) % list.length], size);
};

const REPORT_TYPES = {
  stray:   { name: "Stray animal",   pic: "dog" },
  injured: { name: "Injured animal", pic: "bandage" },
  missing: { name: "Missing pet",    pic: "catSad" }
};
const pinOk = p => /^[1-9]\d{5}$/.test(String(p).trim());

/* Sample clinic list for the prototype (names and numbers are placeholders, not real clinics) */
const CLINICS = [
  { name: "Banjara Pet Hospital", area: "Banjara Hills", city: "Hyderabad", pin: "500034", phone: "040 2400201", open24: true,  services: "Emergency, surgery, X-ray" },
  { name: "Secunderabad Animal Emergency Centre", area: "Marredpally", city: "Hyderabad", pin: "500026", phone: "040 2400202", open24: true,  services: "Emergency, ICU, oxygen" },
  { name: "Kukatpally Vet Care", area: "KPHB Colony", city: "Hyderabad", pin: "500072", phone: "040 2400203", open24: false, from: 9, to: 21, services: "Check-ups, vaccination" },
  { name: "Gachibowli Pet Clinic", area: "Gachibowli", city: "Hyderabad", pin: "500032", phone: "040 2400204", open24: false, from: 10, to: 20, services: "Check-ups, grooming, minor surgery" },
  { name: "Happy Tails Pet Hospital", area: "Benz Circle", city: "Vijayawada", pin: "520010", phone: "0866 2400101", open24: true,  services: "Emergency, surgery, X-ray" },
  { name: "Krishna Animal Emergency Centre", area: "Gunadala", city: "Vijayawada", pin: "520004", phone: "0866 2400102", open24: true,  services: "Emergency, ICU, oxygen" },
  { name: "Labbipet Vet Care", area: "Labbipet", city: "Vijayawada", pin: "520010", phone: "0866 2400103", open24: false, from: 9, to: 21, services: "Check-ups, vaccination" },
  { name: "PawsFirst Emergency Vet", area: "Kothapet", city: "Guntur", pin: "522001", phone: "0863 2400104", open24: true,  services: "Emergency, poisoning care, lab" },
  { name: "Guntur Animal Care Clinic", area: "Brodipet", city: "Guntur", pin: "522002", phone: "0863 2400105", open24: false, from: 9, to: 21, services: "Check-ups, vaccination, grooming" },
  { name: "Mangalagiri Pet Clinic", area: "Main Road", city: "Mangalagiri", pin: "522503", phone: "0864 2400106", open24: false, from: 10, to: 20, services: "Check-ups, minor surgery" },
  { name: "Amaravati Pet Clinic", area: "Thullur", city: "Amaravati", pin: "522237", phone: "0864 2400107", open24: false, from: 9, to: 19, services: "Check-ups, vaccination" },
  { name: "Tenali Round-the-Clock Vet", area: "Bose Road", city: "Tenali", pin: "522201", phone: "0864 2400108", open24: true,  services: "Emergency, surgery" }
];
const CITIES = ["Hyderabad", "Secunderabad", "Vijayawada", "Guntur", "Amaravati", "Mangalagiri", "Tenali", "Visakhapatnam", "Warangal"];
const openNow = c => c.open24 || (now.getHours() >= c.from && now.getHours() < c.to);
const hoursText = c => c.open24 ? "Open 24/7" : `${c.from > 12 ? c.from - 12 + " pm" : c.from + " am"} – ${c.to > 12 ? c.to - 12 + " pm" : c.to + " am"}`;

function sampleData() {
  return {
    nextReport: 7, nextPet: 4, nextContact: 2,
    reports: [
      { id: 1, type: "injured", species: "Dog", area: "Benz Circle", city: "Vijayawada", pin: "520010", landmark: "Near bus stop", date: "2026-10-24",
        details: "Limping on back left leg, wound on paw", severity: "Urgent", reporter: "Kavya", phone: "9876500011", status: "Open" },
      { id: 2, type: "stray", species: "Cat", area: "Brodipet", city: "Guntur", pin: "522002", landmark: "4th line market", date: "2026-10-22",
        details: "Mother cat with 3 kittens, looks hungry", count: 4, reporter: "Rahul", phone: "9876500012", status: "Open" },

/* Shrink an uploaded photo so it fits in the browser's storage */
function shrinkPhoto(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}
let pendingPhoto = "";
function reportAfter(type) {
  return () => {
  pendingPhoto = "";
  const input = $("#photo"), prev = $("#photo-prev"), clear = $("#photo-clear"), perr = document.querySelector('[data-err="photo"]');
  const reset = () => { pendingPhoto = ""; input.value = ""; prev.hidden = true; clear.hidden = true; };
  input.addEventListener("change", async () => {
    perr.textContent = "";
    const file = input.files[0]; if (!file) return reset();
    if (!file.type.startsWith("image/")) { reset(); perr.textContent = "Please choose an image file (JPG or PNG)."; return; }
    if (file.size > 10 * 1024 * 1024) { reset(); perr.textContent = "This photo is larger than 10 MB."; return; }
    try { pendingPhoto = await shrinkPhoto(file); prev.src = pendingPhoto; prev.hidden = false; clear.hidden = false; }
    catch (e) { reset(); perr.textContent = "This image could not be opened. Try another photo."; }
  });
  clear.addEventListener("click", reset);
  $("#rform").addEventListener("submit", e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const ok = validate([
      ["species", f.species, "Choose the animal."],
      ["count", type !== "stray" || (/^\d+$/.test(f.count) && +f.count >= 1 && +f.count <= 50), "Enter a number from 1 to 50."],
      ["severity", type !== "injured" || f.severity, "Choose how serious it is."],
      ["petName", type !== "missing" || textOk(f.petName || ""), "Enter your pet's name."],
      ["date", f.date && f.date <= TODAY, "Pick a date that is not in the future."],
      ["area", textOk(f.area), "Enter the area."],
      ["city", textOk(f.city), "Enter the city."],
      ["pin", pinOk(f.pin), PIN_MSG],
      ["details", textOk(f.details, 5), "Add a few words of description."],
      ["reporter", textOk(f.reporter), "Enter your name."],
      ["phone", phoneOk(f.phone), "Enter a valid 10-digit mobile number."]
    ]);
    if (!ok) return;
    const r = { id: S.nextReport++, type, species: f.species, area: f.area.trim(), city: f.city.trim(), pin: f.pin.trim(), landmark: (f.landmark || "").trim(),
      date: f.date, details: f.details.trim(), reporter: f.reporter.trim(), phone: f.phone.trim(), status: "Open" };
    if (type === "stray") r.count = +f.count;
    if (type === "injured") r.severity = f.severity;
    if (type === "missing") r.petName = f.petName.trim();
    if (pendingPhoto) r.photo = pendingPhoto;
    S.reports.push(r);
    let msg = `Report #${r.id} submitted${r.photo ? " with photo" : ""}. Thank you for helping!`;
    if (!save() && r.photo) { delete r.photo; save(); msg = `Report #${r.id} submitted, but the photo was too large to store in this browser.`; }
    pendingPhoto = ""; toast(msg);
    reportFilter = "all"; location.hash = "#rescue";
  });
  };
}

let clinicSearch = null;
function nearness(pin, c) {
  if (c.pin === pin) return [0, "Same PIN code"];
  if (c.pin.slice(0, 4) === pin.slice(0, 4)) return [1, "Very close"];
  if (c.pin.slice(0, 3) === pin.slice(0, 3)) return [2, "Same district"];
  if (c.pin.slice(0, 2) === pin.slice(0, 2)) return [3, "Nearby region"];
  return [9, ""];
}
function clinicCard(c, label) {
  return `<div class="clinic">

}

    unsafe: ["Chocolate", "Grapes and raisins", "Onion and garlic", "Xylitol (sugar-free gum, sweets)", "Cooked bones", "Alcohol and caffeine"]
  },
  Cat: {
    "Kitten (under 1 year)": { meals: "3–4 small meals a day", food: ["Kitten food (wet and dry)", "Fresh water at all times"],
      care: ["Vaccination course from 8 weeks, as your vet advises", "Deworming as advised by your vet", "Litter training and safe play"] },
    "Adult (1–10 years)": { meals: "2 meals a day", food: ["Balanced adult cat food (cats need meat-based protein)", "Some wet food to keep them hydrated"],
      care: ["Yearly vaccination boosters", "Regular grooming, especially long-haired cats", "Clean litter box daily"] },
    "Senior (11+ years)": { meals: "2–3 smaller meals a day", food: ["Senior cat food", "Plenty of water — older cats get dehydrated easily"],
      care: ["Vet check-up every 6 months", "Watch for weight loss and changes in drinking", "Soft, warm resting places"] },
    unsafe: ["Lilies (all parts are poisonous to cats)", "Onion and garlic", "Chocolate", "Grapes and raisins", "Cow's milk (upsets many cats' stomachs)", "Dog food as a regular diet"]
  }
};
let careSpecies = "Dog", careStage = "Adult (1–7 years)";
PAGES.care = () => {
  const sp = CARE[careSpecies], stages = Object.keys(sp).filter(k => k !== "unsafe");
  if (!stages.includes(careStage)) careStage = stages[1];
  const g = sp[careStage];
  return `
  ${crumb("Pet Food &amp; Care")}
  <div class="title-row"><h1>Pet Food &amp; Care</h1></div>
  <p class="lead">General guidance for healthy dogs and cats. Your vet's advice comes first, especially for puppies, kittens and sick pets.</p>
  <div class="tabs" id="care-sp">${["Dog", "Cat"].map(s => `<button data-s="${s}" class="${s === careSpecies ? "on" : ""}">${s}</button>`).join("")}</div>
  <div class="tabs" id="care-st">${stages.map(s => `<button data-t="${s}" class="${s === careStage ? "on" : ""}">${s}</button>`).join("")}</div>
  <div class="grid g3">
    <div class="panel"><h2>Feeding</h2><p><b>${g.meals}</b></p><ul class="clean">${g.food.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div class="panel"><h2>Care</h2><ul class="clean">${g.care.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div class="panel"><h2>Never feed</h2><ul class="clean">${sp.unsafe.map(x => `<li>${x}</li>`).join("")}</ul></div>
  </div>`;
};
PAGES.care.after = () => {
  $("#care-sp").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { careSpecies = b.dataset.s; careStage = ""; render(); } });
  $("#care-st").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { careStage = b.dataset.t; render(); } });
};

/* ---------- Ask LuckyPaws ---------- */
const ANSWERS = [
  { k: ["seizure", "fits", "fit ", "shaking", "convuls"], a: "Keep your hands away from the mouth, move things away so your pet cannot get hurt, and time the seizure. If it lasts more than 5 minutes or happens again, go to a vet now. Emergency Help → Seizure / fits has a timer and steps." },
  { k: ["poison", "ate something", "rat ", "medicine", "tablet"], a: "Move your pet away from the poison, keep the packet, and go to a vet straight away. Do not make your pet vomit unless a vet tells you to. See Emergency Help → Suspected poisoning." },
  { k: ["breath", "collapse", "faint", "blue gum", "pale gum"], a: "Breathing trouble or collapse is always an emergency. Keep your pet calm, loosen the collar and go to the nearest 24/7 clinic. See Emergency Help → Breathing difficulty / collapse." },
  { k: ["blood in", "bloody", "black stool"], a: "Blood in vomit or stool needs a vet today. Use Emergency Help → Vomiting / blood in vomit or stool to check how urgent it is." },
  { k: ["emergency", "bleeding", "accident", "hit by", "clinic", "hospital", "24/7", "vet near"], a: "This sounds like an emergency. Open Emergency Help to find vet clinics near your PIN code and the 24/7 emergency clinics. Keep the animal calm, warm and still on the way." },
  { k: ["vaccin", "rabies", "injection", "booster"], a: "Puppies and kittens start their vaccination course at about 6–8 weeks, with boosters as your vet advises. Adult dogs and cats usually need yearly boosters, including anti-rabies. Save each vaccination in My Pet so LuckyPaws reminds you when the next one is due." },
  { k: ["fever", "vomit", "diarrh", "not eating", "lethargic", "sick"], a: "A pet that stops eating, vomits repeatedly, has diarrhoea for more than a day, or is very weak should see a vet soon. Keep fresh water available and do not give human medicines — many are poisonous to pets." },
  { k: ["chocolate", "grape", "onion", "garlic", "toxic", "unsafe", "lily", "lilies", "xylitol"], a: "Never give chocolate, grapes or raisins, onion, garlic or xylitol to pets. Lilies are very dangerous for cats. If your pet has eaten one of these, contact a vet immediately. The full list is in Food & Care." },
  { k: ["food", "feed", "diet", "meal", "eat"], a: "Puppies and kittens need 3–4 small meals a day; adult dogs and cats usually eat 2 meals a day. Always keep fresh water out. See Food & Care for guides by age." },
  { k: ["stray", "street"], a: "To help a stray, use Rescue & Stray → Report a stray animal with the exact area, PIN code and a landmark. Add a photo of the animal so rescuers can recognise it." },
  { k: ["lost", "missing", "find my"], a: "Report your pet in Rescue & Stray → Report a missing pet with a clear description, the place and PIN code where it was last seen, and your number. A microchip makes it much easier to return a lost pet." },
  { k: ["deworm", "worm"], a: "Puppies and kittens are dewormed often in their first months, then adult pets usually every 3 months. Ask your vet for the right medicine and dose for your pet's weight." },
  { k: ["tick", "flea"], a: "Check your pet's ears, neck and paws for ticks after walks. Use a vet-approved tick and flea treatment regularly and keep bedding clean." },
  { k: ["adopt"], a: "Adopting a rescued animal gives it a second chance. Visit local shelters, meet the animal a few times, and make sure you can give it food, vaccinations and time every day." }
];
let chat = [{ who: "bot", text: "Hi! I'm the LuckyPaws assistant. Ask me about food, vaccinations, health signs, emergencies, strays or missing pets.\n\nI answer from LuckyPaws' built-in pet-care guide. I'm not a vet — in an emergency, please go to a vet." }];
function reply(q) {
  const t = q.toLowerCase() + " ";
  const hit = ANSWERS.find(x => x.k.some(k => t.includes(k)));
  return hit ? hit.a : "I don't have an answer for that yet. Try asking about food, vaccinations, sickness, emergencies, toxic foods, strays or missing pets — or ask your vet.";
}
PAGES.ask = () => `
  ${crumb("Ask LuckyPaws")}
  <div class="title-row"><h1>Ask LuckyPaws</h1></div>
  <p class="lead">Quick answers to common pet-care questions.</p>
  <div class="panel chat">
    <div class="chips" id="chips">${["What should my puppy eat?", "When are vaccinations due?", "My dog is having a seizure", "Is chocolate bad for dogs?", "My pet is missing"].map(c => `<button class="chip">${c}</button>`).join("")}</div>
    <div class="chat-log" id="log">${chat.map(m => `<div class="msg ${m.who}">${esc(m.text)}</div>`).join("")}</div>
    <form class="chat-input" id="askf"><input name="q" placeholder="Type your question..." autocomplete="off"><button class="btn primary">Send</button></form>
  </div>`;
PAGES.ask.after = () => {
  const log = $("#log"); log.scrollTop = log.scrollHeight;
  const send = q => { if (!q.trim()) return; chat.push({ who: "me", text: q.trim() }, { who: "bot", text: reply(q) }); render(); setTimeout(() => $("#askf").elements.q.focus()); };
  $("#askf").addEventListener("submit", e => { e.preventDefault(); send(e.target.elements.q.value); });
  $("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) send(b.textContent); });
};

/* ================= Theme and router ================= */
function render() {
  clearInterval(timerT);
  const route = (location.hash || "#home").slice(1);
  let html, after;
  if (route.startsWith("pet-")) { const id = +route.slice(4); html = petPage(id); after = () => petAfter(id); }
  else { const page = PAGES[route] || PAGES.home; html = page(); after = page.after; }
  $("#app").innerHTML = html;
  const section = route.startsWith("pet-") || route === "add-pet" ? "mypet" : route.startsWith("report-") ? "rescue"
    : route.startsWith("em-") ? "emergency" : (PAGES[route] ? route : "home");
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("active", a.dataset.nav === section));
  $("#menu").classList.remove("open");
  if (after) after();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
$("#burger").addEventListener("click", () => $("#menu").classList.toggle("open"));
$("#logo-img").innerHTML = em("logo", 42);
$("#cities").innerHTML = CITIES.map(c => `<option value="${c}">`).join("");
load();
render();
</script>
</body>
